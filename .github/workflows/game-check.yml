name: Game syntax and smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testing_only
          POSTGRES_DB: nakami_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nakami_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server dependencies
        run: python -m pip install -r live/requirements.txt
      - name: Verify Python files
        run: python -m compileall -q live
      - name: Verify JavaScript files
        run: |
          for f in live/public/*.js; do node --check "$f"; done
      - name: Test five additional original board/card game modes
        run: python live/test_board_plus.py
      - name: Test newly added games through four live WebSocket connections
        run: python live/test_board_plus_socket.py
      - name: Test all five new smartphone game screens
        run: node live/test_board_plus_ui.js
      - name: Test five popular board-game-inspired online modes
        run: python live/test_board_games.py
      - name: Test new board games on four real WebSocket clients
        run: python live/test_board_socket.py
      - name: Test browser UI for all five board game modes
        run: node live/test_board_ui.js
      - name: Test all three new game flows
        run: python live/test_extra_modes.py
      - name: Test the newest party game modes
        run: python live/test_more_modes.py
      - name: Test senryu, flexible tanka, and book titles
        run: python live/test_word_games.py
      - name: Test secret drawing and picture telephone
        run: python live/test_draw_party.py
      - name: Test new art contest, NG drawing and title bluff
        run: python live/test_draw_extra.py
      - name: Test new art mixing, collaborative and reverse drawing modes
        run: python live/test_draw_mix.py
      - name: Test invention and character-design competitions
        run: python live/test_design_games.py
      - name: Test millishira share, owner privacy, layers and transparency
        run: python live/test_milli.py
      - name: Test anonymous episode game
        run: python live/test_episode.py
      - name: Test real PostgreSQL restart snapshots and recovery
        env:
          TEST_ROOM_DATABASE_URL: postgresql://postgres:testing_only@localhost:5432/nakami_test
        run: python live/test_room_store_postgres.py
      - name: Test complete server restart with restored games and echa rooms
        env:
          TEST_ROOM_DATABASE_URL: postgresql://postgres:testing_only@localhost:5432/nakami_test
        run: python live/test_room_restart_integration.py
      - name: Test full multiplayer WebSocket connection and resume
        run: python live/test_multiplayer_socket.py
      - name: Test collaborative art chat rooms
        run: python live/test_echa.py
      - name: Test art-chat ordered broadcasting and stale client isolation
        run: python live/test_realtime_notifications.py
      - name: Test mobile pinch gestures and touch safe controls
        run: node live/test_touch_gestures.js
      - name: Test two-finger tap undo versus pinch in shared echa
        run: node live/test_echa_touch.js
      - name: Test long-press selection blocking without affecting chat inputs
        run: node live/test_art_selection_guard.js
      - name: Test profile maker sharing and sanitization
        run: node live/test_profile_maker.js
      - name: Test echa bucket flood-fill and color tolerance
        run: node live/test_echa_fill.js
      - name: Test echa bucket rendering with separate lineart and color layers
        run: node live/test_echa_bucket_render.js
      - name: Test echa client layer compositing and timelapse
        run: node live/test_echa_client.js
      - name: Test multiplayer player count filters
        run: node live/test_game_filters.js
      - name: Import game modules
        run: |
          cd live
          python - <<'PY'
          from party_modes import GAME_IDS, EVENTS
          from master_admin import GAMES
          from party_more import GAME_IDS as NEW_GAME_IDS, EVENTS as NEW_EVENTS
          assert {'unanimous','insider','secret_rank'} <= GAME_IDS
          assert {'unanimous','insider','secret_rank'} <= set(GAMES)
          assert {'un_answer','in_question','sr_order'} <= EVENTS
          assert {'describe','drawfake','mysterymail'} <= NEW_GAME_IDS
          assert {'describe','drawfake','mysterymail'} <= set(GAMES)
          assert {'desc_clue','draw_stroke','mail_answer'} <= NEW_EVENTS
          print('All six recent games are registered')
          PY
