<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f23b9d"><title>なかみくらべ。｜リンクで遊ぶ</title><style>
:root{--pink:#ee389e;--dark:#aa2770;--ink:#2a2639;--muted:#726776;--line:#edcddb;--bg:#fff8fc;--yellow:#ffdf67;--cream:#fff8e4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 6% 4%,#ffe5f2,transparent 28%),radial-gradient(circle at 91% 15%,#fff0b7,transparent 23%),#fffafb;font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:var(--ink);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6050cc;outline-offset:2px}.wrap{width:min(920px,calc(100% - 32px));margin:0 auto}header{background:#fffefaed;border-bottom:1px solid #f2d9e7}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:76px}.brand{font-weight:1000;letter-spacing:-.065em;font-size:clamp(20px,3.6vw,27px)}.logo{background:var(--pink);color:white;display:inline-flex;width:40px;height:40px;border-radius:13px;align-items:center;justify-content:center;margin-right:9px;transform:rotate(-8deg)}.tag{color:var(--dark);font-size:12px;font-weight:900;background:#ffe8f4;border:1px solid #fac0dd;border-radius:50px;padding:7px 10px}.hero{margin:46px 0 28px}.kicker{font-size:13px;letter-spacing:.07em;font-weight:900;color:var(--dark)}h1{font-size:clamp(29px,5.5vw,49px);letter-spacing:-.065em;line-height:1.35;margin:8px 0}h2{font-size:clamp(24px,4vw,32px);letter-spacing:-.045em;margin:7px 0 15px}p{line-height:1.75}.lead{color:var(--muted);font-weight:650}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:26px 0}.game{padding:24px;text-align:left;background:white;border:2px solid #f0cfde;border-radius:22px;box-shadow:6px 6px 0 #f9dfec;min-height:194px;display:flex;flex-direction:column;gap:13px}.game:hover{border-color:var(--pink);transform:translateY(-2px)}.emoji{font-size:30px}.game strong{font-size:23px}.game small{line-height:1.6;color:var(--muted);font-weight:650}.panel{background:#fff;border:2px solid #f2d4e4;border-radius:25px;overflow:hidden;box-shadow:0 18px 45px #6d254117;margin:28px 0 70px}.panel-head{padding:20px 25px;background:var(--pink);color:white}.panel-head h2{margin:5px 0}.body{padding:25px}.label{font-weight:900;display:block;font-size:14px;margin:20px 0 8px}.input{width:100%;padding:12px 13px;border-radius:12px;border:2px solid #e8d1df;background:white;color:var(--ink)}textarea.input{min-height:102px;resize:vertical}.btns{display:flex;flex-wrap:wrap;gap:10px;margin:23px 0}.btn{padding:13px 17px;min-height:49px;border-radius:12px;border:2px solid transparent;font-weight:900;background:var(--pink);color:white}.btn.alt{background:#fff3fa;color:var(--dark);border-color:#f0a7d0}.btn.gold{background:var(--yellow);color:#583745}.btn:disabled{opacity:.35;cursor:not-allowed}.hint{background:#fff6e5;border-left:4px solid #e7b542;border-radius:0 12px 12px 0;padding:11px 14px;color:#6f5943;font-size:13px;line-height:1.7;margin:15px 0}.step{font-size:12px;font-weight:900;color:var(--dark)}.question{font-weight:900;font-size:clamp(18px,3.8vw,24px);margin:22px 0 12px}.choices{display:grid;gap:10px}.choice{border:2px solid #efdae6;border-radius:12px;text-align:left;min-height:50px;background:white;padding:13px 15px;color:var(--ink);font-weight:750}.choice.on{background:#ffe5f2;border-color:var(--pink)}.summary{background:#fff1f9;border:1px solid #ffcee5;border-radius:18px;padding:19px;margin:18px 0}.url{width:100%;border:1px dashed #dfb0c8;border-radius:9px;padding:11px;word-break:break-all;background:#fcf8fb;font-size:12px;line-height:1.6;max-height:120px;overflow:auto}.tiers{display:grid;gap:8px}.tier{display:grid;grid-template-columns:55px 1fr auto;align-items:center;gap:9px;padding:8px;border:1px solid #ecd8e2;border-radius:11px;background:#fff}.rank{display:grid;place-items:center;min-height:52px;border-radius:8px;font-size:24px;font-weight:1000;color:#302638}.rank-S{background:#ff989d}.rank-A{background:#ffc191}.rank-B{background:#ffe29b}.rank-C{background:#c2eeb8}.rank-D{background:#bee4f6}.tier-name{font-weight:800;overflow-wrap:anywhere}.arrow{border:1px solid #ecc2d7;color:var(--dark);background:#fff4f8;border-radius:8px;padding:8px 10px;font-weight:bold}.arrow:disabled{opacity:.2}.small{color:var(--muted);font-size:13px}.error{color:#af1f59;background:#ffeaf3;padding:11px;border-radius:9px;font-weight:750}.board{display:grid;gap:9px}.row{background:#fff8fc;border:1px solid #edd9e5;border-radius:12px;padding:13px;display:flex;justify-content:space-between;align-items:center;gap:9px}.score{font-size:27px;font-weight:1000;color:var(--pink)}.review{display:grid;gap:7px}.review-item{background:#f9f8fa;border-radius:10px;padding:11px;line-height:1.7;font-size:14px}.review-item.yes{border-left:4px solid #35a883}.review-item.no{border-left:4px solid #ec79ab}.foot{text-align:center;margin:35px 0;color:#877387;font-size:12px}@media(max-width:580px){.cards{grid-template-columns:1fr}.panel-head{padding:20px}.body{padding:18px}.tier{grid-template-columns:45px 1fr auto;padding:6px}.rank{font-size:20px;min-height:49px}.arrow{padding:8px}.tag{font-size:10px}}
</style></head><body><header><div class="wrap top"><div class="brand"><span class="logo">♡</span>なかみくらべ。</div><span class="tag">🔗 リンクで遊ぶ版</span></div></header><main id="app" class="wrap"></main><footer class="foot">好きなタイミングで答えを予想しよう。回答は自分で選んでね。</footer><script>
'use strict';
const DATA={
 tier:{name:'みんなでTier予想',icon:'🏆',desc:'5つのワードをS〜Dに並べ、主役の本当の順位を当てる',sets:[{title:'休日にいちばんやりたいこと',items:['ゲーム','映画','カラオケ','旅行','家でのんびり']},{title:'テンションが上がるプレゼント',items:['手紙','お菓子','ゲーム','服','一緒に遊ぶ約束']},{title:'好きなデート・おでかけ',items:['水族館','遊園地','映画館','食べ歩き','おうち時間']} ]},
 value:{name:'これって重い？価値観予想',icon:'💗',desc:'「嬉しい／嬉しいけど重い／重い」の本人の選択を当てる',qs:[{q:'毎日「好き」と言ってくれる',options:['嬉しい','嬉しいけど重い','重い']},{q:'朝と夜、毎日あいさつの連絡をくれる',options:['嬉しい','嬉しいけど重い','重い']},{q:'LINEをすぐに返さないと催促される',options:['嬉しい','嬉しいけど重い','重い']},{q:'デートのたび家まで送り届けてくれる',options:['嬉しい','嬉しいけど重い','重い']},{q:'自分の好きな作品を全部知ろうとしてくれる',options:['嬉しい','嬉しいけど重い','重い']},{q:'毎回デートを細かく計画してくれる',options:['嬉しい','嬉しいけど重い','重い']},{q:'自分に合わせて趣味を変えようとしてくれる',options:['嬉しい','嬉しいけど重い','重い']},{q:'毎日寝る前に長電話したがる',options:['嬉しい','嬉しいけど重い','重い']}]},
 either:{name:'究極の二択予想',icon:'⚖️',desc:'主役ならAとBのどちらを選ぶか全員で予想する',qs:[{q:'付き合うならどっち？',options:['顔がタイプだけどお金がない','お金持ちだけど顔がタイプではない']},{q:'どちらの恋愛を選ぶ？',options:['自分から一生告白する','相手から一生告白される']},{q:'好きのバランスは？',options:['自分が100好き・相手は70好き','相手が100好き・自分は70好き']},{q:'どちらの人がいい？',options:['毎日好きと言うが行動は苦手','言葉は少ないが行動で示す']},{q:'プレゼントならどちらが嬉しい？',options:['高価だけど自分の趣味ではない','安いけど自分の好みにぴったり']},{q:'どちらを選ぶ？',options:['毎日会えるけど会う時間は短い','週1回だけど長く会える']},{q:'大切にしたいのは？',options:['夢を応援してくれる人','どんな時も一緒にいてくれる人']},{q:'どっちを知りたい？',options:['恋人の過去の恋愛全部','恋人の将来の恋愛全部']}]},
 quiz:{name:'私の理解度クイズ',icon:'🎯',desc:'自分の好みを正解として登録し、友達が何問当てるか競う',qs:[{q:'私がいちばん落ち着く場所は？',options:['自分の部屋','カフェ','自然のある所','にぎやかな所']},{q:'私が休みにいちばんしたいのは？',options:['ゲーム','外出','睡眠','創作']},{q:'私にとって重要なのは？',options:['自由','安心','刺激','人とのつながり']},{q:'私が好きな連絡頻度は？',options:['毎日何回も','毎日少し','用事のときだけ','気分次第']},{q:'遊びに行くときは？',options:['計画派','ノープラン派','相手にお任せ','半分だけ決める']},{q:'私がプレゼントでもらうなら？',options:['実用品','お菓子','趣味のもの','手紙']},{q:'私が元気を出したいときは？',options:['人と話す','ひとりになる','音楽を聴く','好きなものを食べる']},{q:'友達との時間で大切なのは？',options:['面白さ','安心感','気遣い','新しい体験']}]}
};
const app=document.getElementById('app');let s={stage:'home'}, draft={};let currentLink='';
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Math.random().toString(36).slice(2,11)+Date.now().toString(36);
const encode=o=>{let bytes=new TextEncoder().encode(JSON.stringify(o)),a='';for(let v of bytes)a+=String.fromCharCode(v);return btoa(a).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const decode=t=>{let b=atob(t.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-t.length%4)%4));return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))))};
const link=(type,o)=>location.href.split('#')[0]+'#'+type+'='+encode(o);
const storeKey=key=>'nakami-share-'+key;
const save=(key,o)=>{try{localStorage.setItem(storeKey(key),JSON.stringify(o))}catch(e){throw Error('端末に保存できません。プライベートブラウズや保存容量をご確認ください。')}};
const load=key=>{try{return JSON.parse(localStorage.getItem(storeKey(key))||'null')}catch{return null}};
const btn=(text,fn,kind='')=>`<button type="button" class="btn ${kind}" onclick="${fn}">${esc(text)}</button>`;
const panel=(sub,title,body)=>`<section class="panel"><div class="panel-head"><div class="step">${esc(sub)}</div><h2>${esc(title)}</h2></div><div class="body">${body}</div></section>`;
function home(){s={stage:'home'};history.replaceState(null,'',location.href.split('#')[0]);app.innerHTML=`<section class="hero"><div class="kicker">♡ YOUR ANSWER, MY GUESS ♡</div><h1>友達の「なかみ」、<br>どこまで知ってる？</h1><p class="lead">まず本人が秘密の答えを決める。友達はリンクから予想。答え合わせして理解度を比べよう！</p></section><div class="cards">${Object.entries(DATA).map(([k,d])=>`<button class="game" onclick="create('${k}')"><span class="emoji">${d.icon}</span><strong>${esc(d.name)}</strong><small>${esc(d.desc)}</small></button>`).join('')}</div><div class="hint">この版は<strong>リアルタイム同期なし</strong>。予想者は完成した「結果リンク」を主役に送り返します。友達とURLだけで遊ぶには、このHTMLをGitHub Pagesなどで公開してください。</div>`;}
function checkGame(g){if(!DATA[g])throw Error('ゲームが見つかりません')}
function buildChallenges(g,owner,title,items){let base={version:1,id:id(),game:g,owner:owner.slice(0,28),created:Date.now()};if(g==='tier'){let i=items.map(x=>x.trim());if(!title.trim()||i.length!==5||i.some(x=>!x||x.length>44)||new Set(i).size!==5)throw Error('お題と重複のない5項目を入力してください');base.title=title.trim().slice(0,100);base.items=i;}else{base.title=DATA[g].name;base.qs=DATA[g].qs;}return base}
function create(g){checkGame(g);s={stage:'create',g,owner:'',set:0};renderSetup()}
function renderSetup(){let g=s.g,d=DATA[g];let isT=g==='tier',p=d.sets?.[s.set];let body=`<div class="summary">まず本人が自分の答えを登録します。この答えは、友達に送るリンクには入れません。</div><label class="label">主役のニックネーム</label><input id="owner" class="input" maxlength="28" placeholder="例：おかゆ" value="${esc(s.owner)}">`;
if(isT)body+=`<label class="label">お題の例を選ぶ（編集可能）</label><select id="preset" class="input" onchange="presetChange(this.value)">${d.sets.map((x,i)=>`<option value="${i}" ${s.set===i?'selected':''}>${esc(x.title)}</option>`).join('')}</select><label class="label">お題</label><input id="title" class="input" maxlength="100" value="${esc(p.title)}">${p.items.map((x,i)=>`<label class="label">並べたい項目 ${i+1}</label><input id="item${i}" class="input" maxlength="44" value="${esc(x)}">`).join('')}`;
else body+=`<p class="small">質問数：${d.qs.length}問。主役が答えてから、友達が同じ質問を予想します。</p>`;
body+=`<div class="btns">${btn('秘密の正解を決める →','startAnswer()')}${btn('戻る','home()','alt')}</div><p id="error" class="error" hidden></p>`;app.innerHTML=panel('STEP 1 / お題を作る',d.name,body)}
function presetChange(v){s.owner=document.getElementById('owner').value;s.set=Number(v);renderSetup()}
function showError(msg){let el=document.getElementById('error');if(el){el.hidden=false;el.textContent=msg}else alert(msg)}
function startAnswer(){try{let owner=document.getElementById('owner').value.trim();if(!owner)throw Error('ニックネームを入力してください');let g=s.g;let c=buildChallenges(g,owner,g==='tier'?document.getElementById('title').value:'',g==='tier'?Array.from({length:5},(_,i)=>document.getElementById('item'+i).value):[]);s={stage:'answer',c,answers:[],idx:0};if(g==='tier')s.answers=[0,1,2,3,4];else s.answers=Array(c.qs.length).fill(null);renderAnswer()}catch(e){showError(e.message)}}
function renderTier(){let c=s.c,order=s.answers;return `<p class="lead">${esc(c.title)}。Sが最上位、Dが最下位。↑↓で入れ替えられます。</p><div class="tiers">${order.map((v,pos)=>`<div class="tier"><span class="rank rank-${'SABCD'[pos]}">${'SABCD'[pos]}</span><span class="tier-name">${esc(c.items[v])}</span><span><button class="arrow" ${pos===0?'disabled':''} onclick="swap(${pos},-1)" title="上へ">↑</button> <button class="arrow" ${pos===4?'disabled':''} onclick="swap(${pos},1)" title="下へ">↓</button></span></div>`).join('')}</div>`}
function swap(i,delta){let j=i+delta;if(j<0||j>=s.answers.length)return;[s.answers[i],s.answers[j]]=[s.answers[j],s.answers[i]];renderAnswer()}
function choose(i,v){s.answers[i]=v;renderAnswer()}
function renderAnswer(){let c=s.c,g=c.game,creating=s.stage==='answer',who=creating?c.owner+'さんの本当の答えを登録':c.owner+'さんの答えを予想';let body='';if(g==='tier'){body=renderTier();}else{let q=c.qs[s.idx];body=`<div class="step">QUESTION ${s.idx+1} / ${c.qs.length}</div><div class="question">${esc(q.q)}</div><div class="choices">${q.options.map((op,i)=>`<button class="choice ${s.answers[s.idx]===i?'on':''}" onclick="choose(${s.idx},${i})">${s.answers[s.idx]===i?'✓ ':''}${esc(op)}</button>`).join('')}</div>`}
let done=(g==='tier'||s.answers[s.idx]!==null);body+=`<div class="btns">${g==='tier'?btn(creating?'お題を完成する →':'予想を提出する →','finishAnswers()'): (s.idx?btn('← 前へ','prev()','alt'):'')+`<button type="button" class="btn" ${done?'':'disabled'} onclick="next()">${s.idx===c.qs.length-1?(creating?'正解を保存する →':'予想を提出する →'):'次の質問 →'}</button>`}</div>`;body+=creating?'<p class="small">この正解はこの端末に保存され、友達向けリンクには含まれません。</p>':'<p class="small">主役の答えを思い浮かべて選んでください。正解はまだ見られません。</p>';
app.innerHTML=panel(creating?'SECRET ANSWER':'FRIEND GUESS',who,body)}
function next(){if(s.answers[s.idx]===null)return;if(s.idx+1<s.c.qs.length){s.idx++;renderAnswer()}else finishAnswers()}
function prev(){s.idx=Math.max(0,s.idx-1);renderAnswer()}
function finishAnswers(){if(s.c.game!=='tier'&&s.answers.some(x=>x===null))return showError('すべて回答してください');if(s.stage==='answer'){let o={c:s.c,answers:[...s.answers]};try{save(s.c.id,o)}catch(e){return showError(e.message)}s={stage:'owner',c:s.c,answers:[...s.answers]};renderOwner()}else if(s.stage==='guess'){s.stage='guessed';renderGuessDone()} }
function renderOwner(){let c=s.c;let share=link('play',c),privateLink=link('owner',{c,answers:s.answers});currentLink=share;app.innerHTML=panel('STEP 2 / 友達に送る','お題が完成！',`<div class="summary"><strong>${esc(c.owner)}さんのお題を公開しよう</strong><p>友達用リンクには<strong>秘密の正解が含まれていません</strong>。友達から予想結果リンクを受け取る方式です。</p></div><div class="label">① 友達に送るリンク</div><div class="url">${esc(share)}</div><div class="btns">${btn('友達用リンクをコピー','copyLink("play")')}${btn('予想画面を試す','openTest()','alt')}</div><div class="label">② 主役だけが保存する復元リンク（絶対に友達に送らない）</div><div class="url">${esc(privateLink)}</div><div class="btns">${btn('秘密の復元リンクをコピー','copyLink("owner")','alt')}${btn('予想結果を取り込む','showBoard()','gold')}</div><div class="hint">URLを共有できるのはサイトをWeb上に公開したあとです。file:// で開いたHTMLファイルへのURLは友達の端末では開けません。主役はこの端末か、秘密の復元リンクを開いた端末で採点できます。</div>`)}
function copyLink(type){let c=s.c,url=link(type,type==='owner'?{c,answers:s.answers}:c);copy(url)}
async function copy(t){try{await navigator.clipboard.writeText(t);alert('リンクをコピーしました')}catch{prompt('コピーできない場合は、この文字列を選んでコピーしてください',t)}}
function openTest(){let url=link('play',s.c);history.pushState(null,'',url);openPlay(s.c)}
function openPlay(c){validChallenge(c);s={stage:'join',c,answers:[],idx:0};app.innerHTML=panel('おともだちからのお題',`${c.owner}さんの${DATA[c.game].name}`,`<p class="lead">${c.owner}さんだったらどう回答する？ 友達の答えを予想して送ろう！</p><div class="summary"><strong>${esc(c.title)}</strong><p>${c.game==='tier'?c.items.map(esc).join('・'):c.qs.length+'問の予想クイズ'}</p></div><label class="label">あなたのニックネーム</label><input class="input" id="guest" maxlength="28" placeholder="例：ともだちA"><div class="btns">${btn('予想スタート →','beginGuess()')}${btn('ホームへ','home()','alt')}</div><p id="error" class="error" hidden></p>`)}
function beginGuess(){let name=document.getElementById('guest').value.trim();if(!name)return showError('ニックネームを入力してください');s.player=name;s.stage='guess';s.idx=0;s.answers=s.c.game==='tier'?[0,1,2,3,4]:Array(s.c.qs.length).fill(null);renderAnswer()}
function renderGuessDone(){let r={version:1,id:s.c.id,game:s.c.game,player:s.player,answers:s.answers,nonce:id()},url=link('result',r);s.r=r;app.innerHTML=panel('STEP 3 / 結果を送信','予想の提出ができた！',`<div class="summary"><strong>${esc(s.player)}さんの予想が完成！</strong><p>この「結果リンク」を主役の ${esc(s.c.owner)}さんに送ってください。主役の端末で採点・集計できます。</p></div><div class="url">${esc(url)}</div><div class="btns">${btn('結果リンクをコピー','copyResult()')}${btn('ホームへ','home()','alt')}</div><p class="small">※これはリアルタイムの送信ではありません。メッセージアプリなどで結果リンクを主役に送る必要があります。</p>`)}
function copyResult(){copy(link('result',s.r))}
function showBoard(){let o=s.answers?{c:s.c,answers:s.answers}:load(s.c.id);if(!o||!o.answers)throw Error('主役の正解が見つかりません');let results=load('board-'+o.c.id)||[];s={stage:'board',...o,results};renderBoard()}
function scoreGuess(c,truth,guess){if(c.game==='tier')return truth.reduce((v,x,i)=>v+(x===guess[i]?1:0),0);return truth.reduce((v,x,i)=>v+(x===guess[i]?1:0),0)}
function validateAnswers(c,a){if(!Array.isArray(a))return false;if(c.game==='tier')return a.length===5&&new Set(a).size===5&&a.every(v=>Number.isInteger(v)&&v>=0&&v<5);return a.length===c.qs.length&&a.every((v,i)=>Number.isInteger(v)&&v>=0&&v<c.qs[i].options.length)}
function validChallenge(c){if(!c||c.version!==1||!DATA[c.game]||!c.id||typeof c.id!=='string'||c.id.length>60||typeof c.owner!=='string'||c.owner.length>28||!c.owner||typeof c.title!=='string'||c.title.length>100)throw Error('お題のデータが不正です');if(c.game==='tier'&&(!Array.isArray(c.items)||c.items.length!==5||c.items.some(v=>typeof v!=='string'||v.length>44)))throw Error('Tierのお題が不正です');if(c.game!=='tier'&&(!Array.isArray(c.qs)||c.qs.length<1||c.qs.length>25||c.qs.some(q=>typeof q.q!=='string'||!Array.isArray(q.options)||q.options.length<2||q.options.length>6||q.options.some(a=>typeof a!=='string'))))throw Error('質問が不正です')}
function renderBoard(){let c=s.c,rows=s.results.map(r=>({...r,score:scoreGuess(c,s.answers,r.answers)})).sort((a,b)=>b.score-a.score);let n=c.game==='tier'?5:c.qs.length;app.innerHTML=panel('結果を取り込んで採点','主役の予想ランキング',`<div class="summary"><strong>${esc(c.owner)}さんのお題：${esc(c.title)}</strong><p>${rows.length}人が回答済み。各ワードの<strong>位置が一致</strong>すると1点です。</p></div><div class="board">${rows.length?rows.map((r,i)=>`<div class="row"><div><strong>${i+1}位　${esc(r.player)}</strong><div class="small">${r.score===n?'🎉 パーフェクト！':'理解度 '+Math.round(r.score/n*100)+'%'}</div></div><span class="score">${r.score} / ${n}</span></div>`).join(''):'<div class="small">まだ取り込まれていません。友達から届いた結果リンクを貼り付けてください。</div>'}</div><label class="label">友達から届いた結果リンクを貼り付ける（複数行OK）</label><textarea id="receive" class="input" placeholder="https://.../#result=...\nhttps://.../#result=..."></textarea><div class="btns">${btn('結果を登録する','importResults()')}${btn('友達に送るURLを表示','renderOwner()','alt')}${btn('ホームへ','home()','alt')}</div><p id="error" class="error" hidden></p><div class="hint">登録した結果は、このブラウザ内に保存されます。点数の算出は主役の秘密の正解と照合して行います。</div>`)}
function importResults(){try{let lines=document.getElementById('receive').value.trim().split(/\s+/).filter(Boolean),rows=[...s.results];if(!lines.length)throw Error('結果リンクを貼り付けてください');for(let line of lines){let m=line.match(/(?:#|^)result=([A-Za-z0-9_-]+)/);if(!m)throw Error('結果リンクの形式が違います');let r=decode(m[1]);if(r.id!==s.c.id||r.game!==s.c.game||!r.player||typeof r.player!=='string'||r.player.length>28||!validateAnswers(s.c,r.answers)||typeof r.nonce!=='string')throw Error('別のお題の結果か、回答が不正です');rows=rows.filter(x=>x.nonce!==r.nonce);rows.push(r)}s.results=rows;save('board-'+s.c.id,rows);renderBoard()}catch(e){showError(e.message)}}
function openResult(r){if(!r||!r.id||!r.game)throw Error('結果リンクが壊れています');let o=load(r.id);if(!o){app.innerHTML=panel('予想結果リンク','正解を持つ主役の端末で開いてください',`<p>このリンクには友達の予想が含まれていますが、主役の正解は含まれていません。</p><div class="hint">主役が同じブラウザで開くか、秘密の復元リンクを先に開いてから、もう一度結果リンクを開いてください。</div>${btn('ホームへ','home()')}`);return}s={stage:'board',...o,results:load('board-'+r.id)||[]};if(r.id!==s.c.id||r.game!==s.c.game||!validateAnswers(s.c,r.answers)||!r.player||typeof r.player!=='string')throw Error('別のお題の結果です');s.results=s.results.filter(x=>x.nonce!==r.nonce);s.results.push(r);save('board-'+r.id,s.results);renderBoard()}
function boot(){try{let m=location.hash.match(/^#(play|owner|result)=([A-Za-z0-9_-]+)$/);if(!m)return home();let data=decode(m[2]);if(m[1]==='play')openPlay(data);if(m[1]==='owner'){validChallenge(data.c);if(!validateAnswers(data.c,data.answers))throw Error('正解データが不正です');save(data.c.id,data);s={stage:'owner',...data};renderOwner()}if(m[1]==='result')openResult(data)}catch(e){home();app.insertAdjacentHTML('afterbegin',`<div class="error">リンクを開けませんでした：${esc(e.message)}</div>`)}}
window.addEventListener('hashchange',boot);boot();
</script></body></html>
