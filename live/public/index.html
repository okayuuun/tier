<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ed3a99"><title>なかみくらべ。｜みんなでリアルタイム</title><style>
:root{--pink:#eb3799;--dark:#aa2470;--ink:#2b2537;--muted:#716476;--line:#efd1e3;--yellow:#ffe172;--green:#bceacb}*{box-sizing:border-box}body{background:radial-gradient(ellipse at 0% 0%,#ffe0f2,transparent 32%),radial-gradient(ellipse at 100% 13%,#fff1bb,transparent 26%),#fffafa;color:var(--ink);font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;margin:0;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #6960c9;outline-offset:2px}header{background:#fffefcdd;border-bottom:1px solid #f1d9e7}.top{max-width:1040px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 16px}.brand{font-size:24px;font-weight:1000;letter-spacing:-.075em}.logo{display:inline-grid;place-items:center;background:var(--pink);color:white;border-radius:12px;width:39px;height:39px;margin-right:9px;transform:rotate(-9deg)}.tag{font-size:12px;font-weight:900;color:var(--dark);background:#ffe2ef;padding:8px 12px;border-radius:99px}.wrap{width:min(900px,calc(100% - 32px));margin:0 auto}.hero{margin:49px 0 32px}.hero h1{font-size:clamp(32px,6vw,54px);letter-spacing:-.065em;line-height:1.3;margin:10px 0}.lead{font-size:15px;line-height:1.8;color:var(--muted);font-weight:650}.kicker{font-weight:950;font-size:13px;letter-spacing:.09em;color:var(--dark)}.pane{background:white;border:2px solid #f0d2e2;border-radius:24px;overflow:hidden;box-shadow:0 16px 38px #ae577a18;margin:26px 0 60px}.head{padding:21px 26px;background:var(--pink);color:white}.head small{font-weight:900;font-size:12px;letter-spacing:.09em}.head h2{font-size:clamp(23px,4vw,31px);margin:6px 0;letter-spacing:-.045em}.body{padding:26px}.labeled{font-weight:900;display:block;margin:17px 0 7px;font-size:14px}.field{width:100%;background:white;border-radius:12px;border:2px solid #e9d0e0;padding:12px 13px;min-height:47px;color:var(--ink)}.btns{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 10px}.btn{min-height:46px;padding:12px 17px;background:var(--pink);color:white;border:2px solid transparent;border-radius:11px;font-size:14px;font-weight:900}.btn.alt{color:var(--dark);background:#fff3f9;border-color:#f4b9d9}.btn.gold{background:var(--yellow);color:#55412d}.btn:disabled{opacity:.37;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{border:2px solid #f0d4e3;border-radius:20px;padding:21px;background:white;text-align:left;min-height:160px;display:flex;flex-direction:column;gap:9px;box-shadow:5px 5px #f9e4ee}.card span{font-size:29px}.card strong{font-size:21px}.card small{font-weight:650;line-height:1.6;color:#746578}.card.on{border-color:var(--pink);background:#fff2f9}.notice{background:#fff7e9;border-left:4px solid #e6b23c;padding:12px 15px;border-radius:0 10px 10px 0;line-height:1.7;color:#745f43;font-size:13px;margin:20px 0}.info{border:1px solid #f2cddd;background:#fff4f9;border-radius:14px;padding:17px;margin:16px 0;line-height:1.7}.infobar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{background:#fff0f8;border:1px solid #eebdd7;color:var(--dark);font-weight:900;padding:7px 11px;border-radius:99px;font-size:12px}.playergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:15px 0}.player{border:1px solid #eecddd;border-radius:14px;padding:13px;background:#fffafd}.player strong{display:block;font-size:15px}.player small{font-weight:800;color:var(--muted);font-size:12px}.player.off{opacity:.5}.player .stars{font-weight:1000;font-size:20px;color:var(--dark)}.board{display:grid;gap:9px}.tier{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:10px;border:1px solid #efdae4;border-radius:11px;padding:7px;background:white}.rank{font-weight:1000;font-size:24px;text-align:center;display:grid;place-items:center;min-height:47px;border-radius:9px}.rS{background:#ff979a}.rA{background:#ffc68e}.rB{background:#ffe79c}.rC{background:#c3eeb7}.rD{background:#c2e6f9}.arrows button{padding:7px 10px;border:1px solid #f0c4d9;color:var(--dark);background:#fff0f7;border-radius:9px;font-weight:1000}.arrows button:disabled{opacity:.25}.itemname{font-weight:850;overflow-wrap:anywhere}.prompt{font-size:20px;font-weight:950;margin:20px 0 10px}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{border:2px solid #efd6e5;border-radius:10px;background:white;color:#34263e;padding:10px 12px;font-weight:800}.choice.on{background:#ffe0f0;border-color:var(--pink)}.questionbox{border-bottom:1px solid #f3e0eb;padding-bottom:17px}.small{font-size:13px;line-height:1.7;color:var(--muted)}.error{background:#fff0f4;color:#a71751;border-left:4px solid #df417e;padding:12px;border-radius:0 9px 9px 0;margin:14px 0;font-weight:750}.ok{color:#12856a}.review{display:grid;gap:8px}.reviewitem{border:1px solid #eed7e5;border-radius:10px;padding:12px;background:#fff}.scoreboard{display:grid;gap:10px;margin:20px 0}.scoreline{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff7fb;border:1px solid #f0d5e4;border-radius:13px;padding:13px}.scoreline b{font-size:27px;color:var(--pink)}.banner{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.code{font-weight:1000;font-size:31px;letter-spacing:.17em;color:var(--dark)}.resultbadge{background:#fff1d4;border:2px solid #f2d47b;border-radius:15px;padding:17px;font-weight:950}.center{text-align:center}.footer{margin:28px auto 44px;text-align:center;color:#877485;font-size:12px}.status{display:inline-flex;gap:7px;align-items:center;font-weight:900;font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#a2a2a2}.dot.online{background:#3cc795}@media(max-width:600px){.cards{grid-template-columns:1fr}.body{padding:17px}.head{padding:19px}.brand{font-size:20px}.tier{grid-template-columns:43px 1fr auto;gap:5px}.rank{font-size:19px}.arrows button{padding:6px 8px}.code{font-size:26px}.tag{font-size:10px}}
</style></head><body><header><div class="top"><div class="brand"><span class="logo">♡</span>なかみくらべ。</div><div class="tag" id="status">● リアルタイム版</div></div></header><main class="wrap" id="app"></main><footer class="footer">全員の選択を秘密にして、主役の答えを予想するゲーム</footer><script>
'use strict';
const app=document.getElementById('app');let ws=null,room=null,me=null,connectCode='',playerName='',pendingAction='',draft=null,connecting=false,retryTimer=null;let desiredGame='tier';
const GAMES={tier:{title:'みんなでTier予想',icon:'🏆',desc:'人ごとに異なるお題！主役の並びを予想'},value:{title:'これって重い？',icon:'💗',desc:'本人の3段階の価値観を当てる'},either:{title:'究極の二択',icon:'⚖️',desc:'本人ならA/Bどちらを選ぶ？'},quiz:{title:'私の理解度クイズ',icon:'🎯',desc:'好みの答えを予想して理解度を競う'}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const action=(title,fn,kind='')=>`<button type="button" class="btn ${kind}" onclick="${fn}">${esc(title)}</button>`;
const panel=(sub,title,content)=>`<section class="pane"><div class="head"><small>${esc(sub)}</small><h2>${esc(title)}</h2></div><div class="body">${content}</div></section>`;
const iid=()=>{let v=new Uint8Array(20);crypto.getRandomValues(v);return Array.from(v,x=>x.toString(16).padStart(2,'0')).join('')};
function getSid(code){let k='nakami_sid_'+code;let sid=sessionStorage.getItem(k);if(!sid){sid=iid();sessionStorage.setItem(k,sid)}return sid}
function status(text,isOn){document.getElementById('status').innerHTML=`<span class="status"><span class="dot ${isOn?'online':''}"></span>${esc(text)}</span>`}
function send(obj){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(obj));else alert('接続が切れています。再接続をお待ちください')}
function landing(){let code=new URLSearchParams(location.search).get('room')||'';app.innerHTML=`<section class="hero"><div class="kicker">REALTIME / みんなで参加</div><h1>予想が当たると、<br>もっと仲良くなる。</h1><p class="lead">各自が秘密の正解を決め、順番に主役になろう。ほかの全員がその人の答えを予想して、まとめて答え合わせ！</p></section><div class="cards">${Object.entries(GAMES).map(([k,d])=>`<div class="card"><span>${d.icon}</span><strong>${d.title}</strong><small>${d.desc}</small></div>`).join('')}</div>${panel('START / ルーム参加','友達といっしょに遊ぼう',`<label class="labeled">あなたのニックネーム</label><input id="nickname" class="field" maxlength="24" placeholder="例：おかゆ" value="${esc(sessionStorage.getItem('nakami_name')||'')}"><label class="labeled">ルームコード（友達の部屋に入る場合）</label><input id="roomcode" class="field" maxlength="6" value="${esc(code.toUpperCase())}" placeholder="例：AB12CD" autocapitalize="characters"><div class="btns">${action('新しい部屋を作る','connectNow("create")')}${action('ルームに参加する','connectNow("join")','alt')}</div><div class="notice">2人以上で遊べます。公開後はURLを送るだけで各自のスマホから参加可能。公開前は同じPCやLAN上で動作確認できます。</div><p id="err" class="error" hidden></p>`)}`;status('未接続',false)}
function error(msg){let e=document.getElementById('err');if(e){e.hidden=false;e.textContent=msg}else{let target=document.querySelector('.body');if(target)target.insertAdjacentHTML('afterbegin',`<p class="error">${esc(msg)}</p>`);else alert(msg)}}
function connectNow(kind){playerName=document.getElementById('nickname').value.trim().slice(0,24);if(!playerName)return error('ニックネームを入力してください');let code=document.getElementById('roomcode').value.trim().toUpperCase();if(kind==='join'&&!/^[A-Z2-9]{6}$/.test(code))return error('6桁のルームコードを入力してください');sessionStorage.setItem('nakami_name',playerName);connectCode=kind==='join'?code:'';pendingAction=kind;openSocket()}
function openSocket(){if(connecting)return;connecting=true;status('接続中…',false);if(ws&&ws.readyState===WebSocket.OPEN)ws.close();let url=(location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws';ws=new WebSocket(url);
ws.onopen=()=>{connecting=false;status('接続中',true);let type=room||connectCode?'join':'create';let code=room?.code||connectCode;let sid=getSid(code||'creating');send({type,code,name:playerName,sid})};
ws.onmessage=evt=>{let obj;try{obj=JSON.parse(evt.data)}catch{return}if(obj.type==='error')return error(obj.message);if(obj.type!=='state')return;room=obj.room;me=obj.me;let code=room.code;let creatingSid=sessionStorage.getItem('nakami_sid_creating');if(creatingSid){sessionStorage.setItem('nakami_sid_'+code,creatingSid);sessionStorage.removeItem('nakami_sid_creating')}connectCode=code;history.replaceState(null,'',location.pathname+'?room='+encodeURIComponent(code));render()};
ws.onclose=()=>{connecting=false;status('切断・再接続中',false);if(room){clearTimeout(retryTimer);retryTimer=setTimeout(openSocket,2000)}else if(connectCode){error('接続できませんでした。サーバーを確認してください')}};
ws.onerror=()=>status('通信エラー',false);
}
function players(){return room.players.map(p=>`<div class="player ${p.online?'':'off'}"><strong>${esc(p.name)} ${p.id===room.owner?'👑':''} ${p.id===me?'（あなた）':''}</strong><small>${p.online?'🟢 接続中':'⚪ 切断中'} ${room.phase==='answer'?(p.answered?'・回答済み':'・未回答'):room.phase==='guess'?(p.id===room.targetId?'・主役':p.guessed?'・予想済み':'・予想中'):''}</small><div class="stars">${p.score} pt</div></div>`).join('')}
function invite(){return location.origin+location.pathname+'?room='+encodeURIComponent(room.code)}
async function copyInvite(){let v=invite();try{await navigator.clipboard.writeText(v);alert('招待リンクをコピーしました')}catch{prompt('このリンクをコピーしてください',v)}}
function roomBar(){return `<div class="banner"><div><div class="kicker">ROOM CODE</div><div class="code">${esc(room.code)}</div></div>${action('招待リンクをコピー','copyInvite()','gold')}</div><p class="small">このURLを友達に送れば参加できます：<span style="overflow-wrap:anywhere">${esc(invite())}</span></p>`}
function render(){if(!room)return landing();let phase=room.phase,title=GAMES[room.game].title,owner=room.owner===me;let top=roomBar();if(phase==='lobby'){let choices=`<div class="cards">${Object.entries(GAMES).map(([k,g])=>`<button class="card ${room.game===k?'on':''}" ${owner?'':'disabled'} onclick="chooseGame('${k}')"><span>${g.icon}</span><strong>${g.title}</strong><small>${g.desc}</small></button>`).join('')}</div>`;
let edit=room.game==='tier'?`<label class="labeled">Tier表のお題（主催者用。ほかの人には別のお題を配ります）</label><input id="game-title" class="field" maxlength="90" value="${esc(room.config.title)}">${room.config.items.map((x,i)=>`<label class="labeled">ワード ${i+1}</label><input id="w${i}" class="field" maxlength="40" value="${esc(x)}">`).join('')}`:`<div class="info">${esc(room.config.title)}／${room.config.qs.length}問</div>`;
let buttons=owner?`<div class="btns">${action('設定を保存する','saveSettings()','alt')}${action('ゲーム開始 →','startGame()')}</div>`:'<div class="info">ルーム作成者がゲームを選び、開始するまでお待ちください。</div>';
app.innerHTML=panel('WAITING ROOM / ゲーム待機中','みんなが集まったらスタート',top+`<div class="kicker">参加メンバー (${room.players.length}人)</div><div class="playergrid">${players()}</div><h3>遊ぶゲーム</h3>${choices}${owner?edit:''}${buttons}<p id="err" class="error" hidden></p><div class="notice">Tier予想ではプレイヤーごとに別のお題が配られます。全員が秘密の回答を決め、その後主役のお題が公開され、残りの全員が順位を予想します。</div>`);return}
if(phase==='answer'){let done=room.players.find(p=>p.id===me)?.answered;app.innerHTML=panel('SECRET / 答えはまだ秘密','自分の本当の答えを決めよう',top+`<div class="info">${esc(room.config.title)}<br><strong>${room.answeredCount} / ${room.active.length}人</strong> が回答済み。まだ他の人には見えません。</div>${done?`<div class="resultbadge center">✅ あなたの正解を登録しました。全員の回答を待っています。</div>`:renderEditor('answer',null)}<div class="playergrid">${players()}</div>${owner?action('未回答の人を除いて進める','send({type:"force"})','alt'):''}<p id="err" class="error" hidden></p>`);return}
if(phase==='guess'){let target=room.players.find(p=>p.id===room.targetId);let isTarget=room.targetId===me,already=room.players.find(p=>p.id===me)?.guessed,eligible=room.active.includes(me);app.innerHTML=panel(`ROUND ${room.roundIndex+1} / ${room.totalTargets}`,'この人の答えを当てよう！',top+`<div class="resultbadge center">今回の主役：<strong style="font-size:25px">${esc(target?.name||'')}</strong><br><span class="small">お題：${esc(room.config.title)}</span></div><p class="lead center">${isTarget?'あなたが主役です。みんながあなたの答えを予想しています！':'この人なら、どう並べる？どう答える？'}</p>${isTarget?'<div class="info center">回答が集まるまで待ってね。正解はまだ秘密！</div>':!eligible?'<div class="info">今回は観戦モードです。</div>':already?'<div class="info center">✅ 予想を提出しました。答え合わせを待っています。</div>':renderEditor('guess',room.targetId)}<div class="playergrid">${players()}</div>${owner?action('途中でも答え合わせする','send({type:"force"})','alt'):''}<p id="err" class="error" hidden></p>`);return}
if(phase==='reveal'){let target=room.players.find(p=>p.id===room.targetId);let rev=room.reveal,rows=[...rev.rows].sort((a,b)=>b.score-a.score);let correct=showAnswer(rev.truth),results=`<div class="scoreboard">${rows.length?rows.map((r,i)=>`<div class="scoreline"><div><strong>${i+1}位 ${esc(r.name)}</strong><div class="small">${r.score===rev.truth.length?'🎉 パーフェクト！':'一致した項目：'+r.score+'個'}</div></div><b>+${r.score} pt</b></div>`).join(''):'<p>予想者はいませんでした。</p>'}</div>`;
let next=owner?action(room.roundIndex+1===room.totalTargets?'最終結果を見る →':'次の主役へ →','send({type:"next"})'):'';
app.innerHTML=panel(`REVEAL ${room.roundIndex+1} / ${room.totalTargets}`,'答え合わせ！',top+`<div class="resultbadge center">${esc(target?.name)}さんの本当の答え</div>${correct}<h3>みんなの予想結果</h3>${results}${next}<div class="playergrid">${players()}</div><div class="small">答え合わせ画面で初めて本人の正解を公開しています。</div>`);return}
if(phase==='final'){let ranked=[...room.players].sort((a,b)=>b.score-a.score);app.innerHTML=panel('FINAL / ゲーム終了','理解度ランキング！',top+`<p class="lead">全員が主役になりました。誰がいちばん友達のことを分かっていた？</p><div class="scoreboard">${ranked.map((p,i)=>`<div class="scoreline"><div><strong>${['🥇','🥈','🥉'][i]||'🏅'} ${i+1}位 ${esc(p.name)}</strong><div class="small">${p.id===me?'あなたの結果':''}</div></div><b>${p.score} pt</b></div>`).join('')}</div>${owner?action('もう一度遊ぶ','send({type:"restart"})'):''}`)}
}
function chooseGame(g){if(!GAMES[g]||room.owner!==me)return;desiredGame=g;send({type:'configure',game:g,config:g==='tier'?{title:'休日にいちばんやりたいこと',items:['ゲーム','映画','カラオケ','旅行','家でのんびり']}:{}})}
function saveSettings(){if(room.owner!==me)return;let g=room.game,config=g==='tier'?{title:document.getElementById('game-title').value,items:Array.from({length:5},(_,i)=>document.getElementById('w'+i).value)}:{};send({type:'configure',game:g,config})}
function startGame(){if(room.game==='tier'){let c={title:document.getElementById('game-title').value,items:Array.from({length:5},(_,i)=>document.getElementById('w'+i).value)};send({type:'configure',game:'tier',config:c});}send({type:'start'})}
function editorInit(kind,target){let key=kind+'_'+room.game+'_'+(target||'self');if(!draft||draft.key!==key){draft={key,kind,target,arr:room.game==='tier'?[0,1,2,3,4]:Array(room.config.qs.length).fill(null)}}}
function renderEditor(kind,target){editorInit(kind,target);let c=room.config,arr=draft.arr;let html='';if(room.game==='tier'){html=`<p class="small">Sがいちばん上。矢印を使って、5つのワードを並べ替えよう。</p><div class="board">${arr.map((item,i)=>`<div class="tier"><span class="rank r${'SABCD'[i]}">${'SABCD'[i]}</span><span class="itemname">${esc(c.items[item])}</span><div class="arrows"><button ${i===0?'disabled':''} onclick="swap(${i},-1)">↑</button> <button ${i===4?'disabled':''} onclick="swap(${i},1)">↓</button></div></div>`).join('')}</div>`}
else{html=`<p class="small">${c.qs.length}問すべて選んでください。</p><div class="review">${c.qs.map((q,qi)=>`<div class="questionbox"><div class="prompt">${qi+1}. ${esc(q.q)}</div><div class="choices">${q.options.map((o,oi)=>`<button class="choice ${arr[qi]===oi?'on':''}" onclick="chooseAnswer(${qi},${oi})">${arr[qi]===oi?'✓ ':''}${esc(o)}</button>`).join('')}</div></div>`).join('')}</div>`}
let filled=room.game==='tier'||arr.every(v=>v!==null);html+=`<div class="btns"><button class="btn" ${filled?'':'disabled'} onclick="submitDraft()">${kind==='answer'?'秘密の正解を登録する':'この予想を送信する'} →</button></div>`;return `<div id="editor">${html}</div>`}
function chooseAnswer(q,v){draft.arr[q]=v;const ed=document.getElementById('editor');if(ed)ed.innerHTML=renderEditor(draft.kind,draft.target)}
function swap(pos,delta){let j=pos+delta;if(j<0||j>=5)return;[draft.arr[pos],draft.arr[j]]=[draft.arr[j],draft.arr[pos]];const ed=document.getElementById('editor');if(ed)ed.innerHTML=renderEditor(draft.kind,draft.target)}
function submitDraft(){if(!draft||room.game!=='tier'&&draft.arr.some(v=>v===null))return;send({type:draft.kind==='answer'?'answer':'guess',answers:draft.arr})}
function showAnswer(answer){if(room.game==='tier')return `<div class="board" style="margin:16px 0">${answer.map((x,i)=>`<div class="tier"><span class="rank r${'SABCD'[i]}">${'SABCD'[i]}</span><strong>${esc(room.config.items[x])}</strong></div>`).join('')}</div>`;return `<div class="review" style="margin:16px 0">${room.config.qs.map((q,i)=>`<div class="reviewitem"><strong>${i+1}. ${esc(q.q)}</strong><div class="ok">→ ${esc(q.options[answer[i]])}</div></div>`).join('')}</div>`}
landing();let roomParam=new URLSearchParams(location.search).get('room');let savedName=sessionStorage.getItem('nakami_name');if(roomParam&&savedName){document.getElementById('nickname').value=savedName;document.getElementById('roomcode').value=roomParam.toUpperCase();connectNow('join')}
</script></body></html>
