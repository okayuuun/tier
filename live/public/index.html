/* Tier authoring modes and readable full-answer comparisons */
.modegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:15px 0}
.mode{padding:17px;background:#fff;border:2px solid #eed5e5;border-radius:15px;text-align:left;color:var(--ink);min-height:105px}
.mode strong{display:block;font-size:16px;margin-bottom:6px}.mode small{font-size:12px;line-height:1.6;color:var(--muted)}
.mode.on{background:#fff0f8;border-color:var(--pink);box-shadow:0 0 0 2px #ffe0f1 inset}.mode:disabled{opacity:.8}
.countbox{background:#fff2f9;border-radius:13px;padding:12px 16px;color:var(--dark);font-weight:900;margin:16px 0}
.composeform{display:grid;gap:6px}.composeform .labeled{margin-top:11px}
.answergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,305px),1fr));gap:13px;margin:13px 0 24px}
.answercard{background:#fff;border:2px solid #edd5e2;border-radius:17px;padding:15px;min-width:0}
.answercard.correct{background:#fff8df;border-color:#f0d27d}
.answercard h3{font-size:17px;margin:0 0 5px;overflow-wrap:anywhere}
.answercard .subline{font-size:12px;font-weight:800;color:#795a70;margin-bottom:12px}
.compareline{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center;margin:6px 0;padding:7px;border-radius:9px;background:#f8f7f9;border-left:4px solid transparent}
.compareline.yes{background:#eefaf1;border-left-color:#29a573}.compareline.no{background:#fff0f3;border-left-color:#ea7990}
.compareline .rank{min-height:36px;font-size:18px;border-radius:7px}
.compareline .word{font-size:13px;font-weight:850;overflow-wrap:anywhere}.compareline .mark{font-size:13px;font-weight:950}
.compareline.yes .mark{color:#147a50}.compareline.no .mark{color:#c33b5f}
.questioncompare{padding:9px 4px;border-bottom:1px solid #f1dfeb;font-size:13px;line-height:1.6}
.questioncompare strong{display:block}.questioncompare span{display:block;padding-left:4px}
.questioncompare.yes span{color:#147a50}.questioncompare.no span{color:#c33b5f}
.recap{border:1px solid #ebd0e0;border-radius:16px;margin:15px 0;background:#fff;overflow:hidden}
.recap summary{cursor:pointer;background:#fff1f9;padding:15px;font-size:15px;font-weight:900;line-height:1.6}
.recap > .inner{padding:15px}.reveal-kicker{font-weight:900;color:var(--dark);font-size:13px;margin-top:18px}
@media(max-width:600px){.modegrid{grid-template-columns:1fr}.answergrid{grid-template-columns:1fr}.answercard{padding:11px}.compareline{gap:6px}}

/* 2026-11 compact results / shared authoring */
.headtools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn.exit{background:#a43e61;color:white}
.qedit{padding:12px 14px 18px;margin:15px 0;border:1px solid #edd0df;background:#fffaff;border-radius:15px}
.qnum{font-size:13px;font-weight:1000;color:#a2276c;letter-spacing:.06em}
.qedit .labeled{margin:9px 0 6px}
.options-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
.edit-option{display:flex;align-items:center;gap:7px;color:var(--dark);font-weight:900;font-size:13px;min-width:0}
.edit-option .field{width:100%;min-width:0;padding:9px 10px}
.compare-wrap{margin:20px 0 26px;background:#fff;border:1px solid #f0d5e5;border-radius:15px;padding:12px 10px 14px}
.compare-caption{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:2px 3px 9px;flex-wrap:wrap}
.compare-caption b{color:#5d2851;font-size:14px}
.compare-caption span{color:#84647b;font-weight:800;font-size:11px}
.compare-table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:3px 5px}
.compare-table th:first-child{width:116px}
.compare-table th{color:#a13c77;font-size:12px;text-align:center}
.compare-table thead th:not(:first-child){background:#ffe5f0;padding:7px 2px;border-radius:8px;font-size:15px}
.compare-table tbody tr th{background:#f9f1f7;border-radius:7px;text-align:left;padding:5px 7px;font-weight:900;overflow:hidden}
.compare-table .truth-row th{background:#f9e8ab}
.compare-table .rowname{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:100%;font-size:12px}
.compare-table .rowpoints{display:block;font-size:10px;font-weight:750;color:#825b76}
.compare-table td{padding:0;min-width:0;max-width:0}
.mini-cell{width:100%;min-height:41px;padding:5px 2px;display:block;border:1px solid transparent;border-radius:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;font-weight:900;cursor:pointer;color:#3b3344}
.mini-cell.neutral{background:#fff0bd;border-color:#edcf70}
.mini-cell.match{background:#d8f4df;border-color:#83d0a3}
.mini-cell.miss{background:#ffe0e8;border-color:#eba1b7}
.mini-cell:focus-visible{outline:3px solid #6657bf;outline-offset:0}
.cell-detail{margin:12px 2px 3px;padding:11px;border-radius:9px;background:#fff7fa;color:#694f62;min-height:40px;font-size:13px;font-weight:650;overflow-wrap:anywhere}
.question-key{margin:10px 3px 3px;border:1px solid #eddbeb;border-radius:9px;padding:10px 12px}
.question-key summary{cursor:pointer;color:#8c3469;font-weight:900;font-size:13px}
.keyitem{border-bottom:1px solid #f2e5eb;padding:11px 0 3px;font-size:12px}
.keyitem b{color:#592b49;font-weight:850}
.keyitem p{margin:7px 0 10px;line-height:1.8;overflow-wrap:anywhere}
.compact-scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:8px;margin:15px 0 24px}
.scorechip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff2fa;border:1px solid #eac2d9;border-radius:11px;padding:10px 12px;font-size:13px}
.scorechip b{color:#b32f81;white-space:nowrap}
@media(max-width:600px){
 .headtools{width:100%;justify-content:flex-start}
 .headtools .btn{padding:9px 10px;min-height:37px;font-size:12px}
 .options-grid{grid-template-columns:1fr}
 .compare-wrap{margin:13px -9px 20px;padding:10px 5px}
 .compare-table{border-spacing:2px 4px}
 .compare-table th:first-child{width:76px}
 .compare-table .rowname{font-size:10px}
 .compare-table .rowpoints{font-size:9px}
 .compare-table tbody tr th{padding:4px}
 .compare-table thead th:not(:first-child){font-size:12px;padding:6px 0}
 .mini-cell{min-height:36px;font-size:10px;padding:5px 1px}
 .compare-caption b{font-size:12px}
 .compare-caption span{font-size:10px}
}
